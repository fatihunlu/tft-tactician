<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="TFT Tactician">
  <defs>
    <linearGradient id="logo-bg" x1="16" y1="0" x2="16" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1014"/>
      <stop offset="1" stop-color="#0c0607"/>
    </linearGradient>
    <linearGradient id="logo-sheen" x1="16" y1="0" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logo-accent" x1="5" y1="29" x2="27" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d13639" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d13639" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d13639" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#logo-bg)"/>
  <rect width="32" height="32" rx="8" fill="url(#logo-sheen)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <path d="M5 29h22" stroke="url(#logo-accent)" stroke-width="1.25" stroke-linecap="round"/>
  <!-- TT monogram — matches site foreground -->
  <g fill="#f4f0f0">
    <rect x="3" y="6" width="11" height="3.5" rx="1"/>
    <rect x="6.25" y="6" width="4.5" height="20" rx="1"/>
    <rect x="18" y="6" width="11" height="3.5" rx="1"/>
    <rect x="21.25" y="6" width="4.5" height="20" rx="1"/>
  </g>
</svg>
